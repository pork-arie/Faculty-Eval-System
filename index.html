<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — Teacher Evaluation System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrapper">
  <div class="login-header">
    <div class="logo">
      <img src="nwssu_logo.jpg" width="40" height="40" alt="Logo" style="object-fit: contain;border-radius: 20px;">
    </div>
    <div class="admin-badge">
      <svg width="10" height="10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      Admin Portal
    </div>
    <h1>Faculty Evaluation</h1>
    <p>Sign in to manage the evaluation system</p>
  </div>

  <div class="login-card">
    <div class="form-group">
      <label class="form-label">Username</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input class="form-control" type="text" id="adminUser" placeholder="Enter admin username" autocomplete="username"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <svg class="input-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input class="form-control" type="password" id="adminPass" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()"/>
      </div>
    </div>

    <button class="btn-login" onclick="doAdminLogin()">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In as Admin
    </button>

    <div class="error-msg" id="loginError">Invalid username or password. Please try again.</div>
  </div>
</div>

<!-- Firebase SDKs (same project as dashboard) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ============================================================
// 🔥 PASTE YOUR SAME FIREBASE CONFIG HERE (same as dashboard.html)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCUD1waV1kPYFKj1zRA7ANVjQkhdP7NJic",
  authDomain: "studenteval-937f6.firebaseapp.com",
  projectId: "studenteval-937f6",
  storageBucket: "studenteval-937f6.firebasestorage.app",
  messagingSenderId: "899672493371",
  appId: "1:899672493371:web:600723b0d16bb879067b1e",
  measurementId: "G-D5WD5LB2E5"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) {}

// Log login attempt to Firebase
async function logLoginToFirebase(username, success) {
  if (!db || firebaseConfig.apiKey === '"AIzaSyCUD1waV1kPYFKj1zRA7ANVjQkhdP7NJic"') return;
  try {
    await db.collection('loginLogs').add({
      username:  username,
      success:   success,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      loginType: 'admin'
    });
  } catch(e) { console.warn('Login log error:', e.message); }
}

// Save/update admin credentials to Firebase when login is changed
async function saveAdminCredsToFirebase(username, password) {
  if (!db || firebaseConfig.apiKey === '"AIzaSyCUD1waV1kPYFKj1zRA7ANVjQkhdP7NJic"') return;
  try {
    await db.collection('settings').doc('adminCreds').set({ username, password });
  } catch(e) { console.warn('Save creds error:', e.message); }
}

// Load admin credentials from Firebase (so creds changed on one device sync everywhere)
async function loadAdminCredsFromFirebase() {
  if (!db || firebaseConfig.apiKey === '"AIzaSyCUD1waV1kPYFKj1zRA7ANVjQkhdP7NJic"') return null;
  try {
    const doc = await db.collection('settings').doc('adminCreds').get();
    if (doc.exists) {
      localStorage.setItem('adminCreds', JSON.stringify(doc.data()));
      return doc.data();
    }
  } catch(e) {}
  return null;
}

async function doAdminLogin() {
  const btn = document.querySelector('.btn-login');
  const user = document.getElementById('adminUser').value.trim();
  const pass = document.getElementById('adminPass').value;
  if (!user || !pass) { document.getElementById('loginError').style.display = 'block'; return; }

  // Show loading
  if (btn) btn.textContent = 'Signing in...';

  // Try to get latest credentials from Firebase first
  const fbCreds = await loadAdminCredsFromFirebase();
  const creds = fbCreds || JSON.parse(localStorage.getItem('adminCreds') || '{"username":"admin","password":"admin123"}');

  if (user === creds.username && pass === creds.password) {
    await logLoginToFirebase(user, true);
    sessionStorage.setItem('adminLoggedIn', 'true');
    sessionStorage.setItem('adminUsername', user);
    window.location.href = 'admin/dashboard.html';
  } else {
    await logLoginToFirebase(user, false);
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('adminPass').value = '';
    if (btn) btn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In as Admin`;
  }
}
</script>

<script src="shared/js/data.js"></script>
</body>
</html>
